name: Build demo image

on:
  push:
    branches: [demo]
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/run-demo-container.sh
      - package.json
      - plugins/repl/requirements.txt
      - .github/workflows/build-demo-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

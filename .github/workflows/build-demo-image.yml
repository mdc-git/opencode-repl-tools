name: Build demo images

on:
  push:
    branches: [master]
    paths:
      - .dockerignore
      - .devcontainer/Dockerfile
      - .devcontainer/controller.Dockerfile
      - .devcontainer/devcontainer.json
      - .devcontainer/opencode-ephemeral.sh
      - .devcontainer/run-demo-container.sh
      - .devcontainer/run-demo-sandbox.sh
      - .devcontainer/start-demo-sandbox.sh
      - .devcontainer/publish-demo.sh
      - package.json
      - bun.lock
      - README.md
      - .opencode/**
      - plugins/**
      - .github/workflows/build-demo-image.yml
  workflow_dispatch:

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo
          build-args: |
            OPENCODE_UPDATE_CACHE_KEY=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
          provenance: false

      - name: Smoke test sandbox image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo"
          name=opencode-repl-tools-demo-smoke
          runtime_volume=opencode-repl-tools-demo-smoke-runtime

          docker volume rm --force "$runtime_volume" >/dev/null 2>&1 || true
          docker volume create "$runtime_volume" >/dev/null
          .devcontainer/run-demo-sandbox.sh "$image" "$name" "127.0.0.1:7681" "$runtime_volume"
          trap 'docker logs "$name" || true; docker rm --force "$name" >/dev/null 2>&1 || true; docker volume rm --force "$runtime_volume" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 100); do
            if curl --fail --silent --show-error http://127.0.0.1:7681/ >/dev/null; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "$name" | grep -qx true; then
              echo 'demo sandbox exited before ttyd became ready' >&2
              exit 1
            fi
            sleep 0.1
          done

          curl --fail --silent --show-error http://127.0.0.1:7681/ >/dev/null

          seed_version="$(docker exec "$name" /opt/opencode-runtime/bin/opencode2 --version)"
          case "$seed_version" in
            "opencode v2."*) ;;
            *)
              echo "baked OpenCode seed is not a stable V2 build: $seed_version" >&2
              exit 1
              ;;
          esac
          printf 'baked OpenCode seed: %s\n' "$seed_version"

          bubblewrap_version="$(docker exec "$name" /usr/bin/bwrap --version)"
          printf 'bubblewrap runtime: %s\n' "$bubblewrap_version"
          test "$bubblewrap_version" = "bubblewrap 0.12.0"
          docker exec "$name" test -x /usr/local/bin/opencode-ephemeral
          docker exec "$name" test ! -e /usr/bin/tmux
          echo 'sandbox runtime assets verified'

          docker exec "$name" bash -ceu '
            workspace=/tmp/opencode-uid-smoke
            rm -rf "$workspace"
            install -d -o 1001 -g 1001 -m 0700 "$workspace"
            sandbox_uid="$(/usr/local/bin/opencode-ephemeral "$workspace" /usr/bin/id -u)"
            printf "ephemeral sandbox uid: %s\n" "$sandbox_uid"
            test "$sandbox_uid" = 1001
            rm -rf "$workspace"
          '

          docker exec -d "$name" bash -ceu '
            workspace=/tmp/opencode-process-smoke
            rm -rf "$workspace"
            install -d -m 0700 "$workspace"
            cp -a /opt/opencode-demo/source/. "$workspace/"
            chmod -R u+rwX,go-rwx "$workspace"
            chown -R 1001:1001 "$workspace"
            ln -s /opt/opencode-repl-tools/node_modules "$workspace/node_modules"
            exec /usr/local/bin/opencode-ephemeral "$workspace" \
              /bin/bash -ceu "tail -f /dev/null | script -qfec \"opencode2 --standalone /workspace\" /dev/null"
          '
          sleep 5

          docker exec "$name" bash -ceu '
            found_ttyd=
            found_opencode=
            for proc in /proc/[0-9]*; do
              comm="$(cat "$proc/comm" 2>/dev/null || true)"
              case "$comm" in
                ttyd|opencode2)
                  grep -Eq "^Uid:[[:space:]]+1001([[:space:]]+1001){3}$" "$proc/status"
                  grep -Eq "^NoNewPrivs:[[:space:]]+1$" "$proc/status"
                  for field in CapInh CapPrm CapEff CapBnd CapAmb; do
                    grep -Eq "^${field}:[[:space:]]+0+$" "$proc/status"
                  done
                  ;;
              esac
              if [[ "$comm" = ttyd ]]; then
                found_ttyd=1
              fi
              if [[ "$comm" = opencode2 ]]; then
                env="$(tr "\000" "\n" <"$proc/environ" 2>/dev/null || true)"
                grep -Fxq "XDG_CONFIG_HOME=/tmp/opencode-xdg/config" <<<"$env"
                grep -Fxq "XDG_DATA_HOME=/tmp/opencode-xdg/data" <<<"$env"
                grep -Fxq "XDG_CACHE_HOME=/tmp/opencode-xdg/cache" <<<"$env"
                grep -Fxq "OPENCODE_DB=/tmp/opencode-xdg/data/opencode/opencode.db" <<<"$env"
                found_opencode=1
              fi
            done
            test "$found_ttyd" = 1
            test "$found_opencode" = 1
          '

          test "$(docker inspect --format '{{.Config.User}}' "$name")" = "0:0"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$name")" = true
          test "$(docker inspect --format '{{.HostConfig.Privileged}}' "$name")" = false
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$name")" = 128
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$name")" = 2147483648
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$name")" = 2000000000
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$name")" = bridge
          test "$(docker inspect --format '{{.HostConfig.CgroupnsMode}}' "$name")" = private
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/opt/opencode-runtime"}}{{.RW}}{{end}}{{end}}' "$name")" = false
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/opt/opencode-runtime"}}{{.Name}}{{end}}{{end}}' "$name")" = "$runtime_volume"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$name" | grep -Eq '"ALL"'
          cap_add="$(docker inspect --format '{{json .HostConfig.CapAdd}}' "$name")"
          for capability in CHOWN DAC_OVERRIDE SETGID SETPCAP SETUID SYS_ADMIN; do
            grep -Fq "\"$capability\"" <<<"$cap_add"
          done
          security_opts="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$name")"
          grep -Fq 'no-new-privileges' <<<"$security_opts"
          grep -Fq 'seccomp=unconfined' <<<"$security_opts"
          grep -Fq 'apparmor=unconfined' <<<"$security_opts"
          test "$(docker inspect --format '{{json .HostConfig.Binds}}' "$name")" = null

          if docker inspect --format '{{json .Config.Env}}' "$name" \
              | grep -Eq '(GH_TOKEN|GITHUB_TOKEN|GITHUB_CODESPACE_TOKEN)='; then
            echo 'GitHub credential variable configured in public sandbox' >&2
            exit 1
          fi

          docker exec "$name" test ! -e /var/run/docker.sock
          docker exec "$name" test ! -e /workspaces
          docker exec "$name" test ! -e /usr/local/bin/gh
          docker exec "$name" test ! -e /usr/local/bin/publish-demo
          docker exec "$name" test -r /opt/opencode-demo/source/package.json
          docker exec "$name" test ! -w /opt/opencode-demo/source/package.json
          docker exec "$name" test ! -w /opt/opencode-runtime/bin/opencode2
          docker exec "$name" test ! -w /opt/opencode-repl-tools/node_modules
          docker exec "$name" test ! -w /opt/opencode-repl-cache
          docker exec "$name" sh -ceu 'test ! -w /; test -w "$HOME"; test -w /tmp'

          docker exec "$name" sh -ceu '
            test -z "$(find / -xdev -type f \( -perm -4000 -o -perm -2000 \) -print -quit)"
            test -z "$(find / -xdev \( -type f -o -type d \) -perm -0002 -print -quit)"
            grep -Eq "^Uid:[[:space:]]+0([[:space:]]+0){3}$" /proc/1/status
            grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status
            if tr "\000" "\n" </proc/1/environ \
                | grep -Eq "^(GH_TOKEN|GITHUB_TOKEN|GITHUB_CODESPACE_TOKEN)="; then
              echo "GitHub credential leaked into trusted sandbox supervisor" >&2
              exit 1
            fi
          '

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated sandbox image
        shell: bash
        run: docker push "ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo"

      - name: Build controller image from validated sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/controller.Dockerfile
          pull: true
          load: true
          push: false
          tags: ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:controller
          cache-from: type=gha,scope=controller
          cache-to: type=gha,mode=max,scope=controller
          provenance: false

      - name: Smoke test controller image
        shell: bash
        run: |
          set -euo pipefail
          sandbox="ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo"
          controller="ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:controller"
          layer_dir="$(mktemp -d)"
          trap 'rm -rf "$layer_dir"' EXIT

          docker run --rm "$controller" sh -ceu '
            bun --version
            docker --version
            gh --version
            git --version
            curl --version >/dev/null
            test "$(bwrap --version)" = "bubblewrap 0.12.0"
            test -x /usr/local/bin/opencode-ephemeral
            test -x /usr/local/bin/run-demo-sandbox
            test -x /usr/local/bin/start-demo-sandbox
            test -x /usr/local/bin/publish-demo
            test -x /opt/opencode-runtime/bin/opencode2
          '

          docker inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$sandbox" \
            | sed '/^$/d' >"$layer_dir/sandbox"
          docker inspect --format '{{range .RootFS.Layers}}{{println .}}{{end}}' "$controller" \
            | sed '/^$/d' >"$layer_dir/controller"
          sandbox_layer_count="$(wc -l <"$layer_dir/sandbox")"
          head -n "$sandbox_layer_count" "$layer_dir/controller" >"$layer_dir/controller-prefix"
          cmp "$layer_dir/sandbox" "$layer_dir/controller-prefix"

          printf 'sandbox image bytes:   %s\n' "$(docker inspect --format '{{.Size}}' "$sandbox")"
          printf 'controller image bytes: %s\n' "$(docker inspect --format '{{.Size}}' "$controller")"

      - name: Install Codespaces Dev Container CLI version
        shell: bash
        run: npm install --global @devcontainers/cli@0.83.3

      - name: Smoke test Codespaces controller
        shell: bash
        run: |
          set -euo pipefail
          result=$(mktemp)
          controller_image=$(docker image inspect --format '{{.Id}}' "ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:controller")
          controller_id=
          sandbox_name=opencode-repl-tools-demo-sandbox
          updater_name=opencode-repl-tools-demo-updater
          runtime_volume=opencode-repl-tools-demo-runtime
          update_cache_volume=opencode-repl-tools-demo-update-cache
          cleanup() {
            docker logs "$sandbox_name" 2>/dev/null || true
            docker rm --force "$sandbox_name" >/dev/null 2>&1 || true
            docker rm --force "$updater_name" >/dev/null 2>&1 || true
            docker volume rm --force "$runtime_volume" >/dev/null 2>&1 || true
            docker volume rm --force "$update_cache_volume" >/dev/null 2>&1 || true
            if [[ -n "$controller_id" ]]; then
              docker exec "$controller_id" cat /root/.cache/opencode-repl-tools-preview.log 2>/dev/null || true
              docker logs "$controller_id" 2>/dev/null || true
              docker rm --force "$controller_id" >/dev/null 2>&1 || true
            fi
            rm -f "$result"
          }
          trap cleanup EXIT

          started=$SECONDS
          devcontainer up \
            --workspace-folder "$PWD" \
            --remove-existing-container \
            --skip-post-attach \
            >"$result"
          startup_seconds=$((SECONDS - started))
          printf 'Codespaces controller startup seconds: %s\n' "$startup_seconds"

          controller_id=$(jq -r '.containerId' "$result")
          test -n "$controller_id"
          test "$controller_id" != null
          test "$(docker inspect --format '{{.Image}}' "$controller_id")" = "$controller_image"

          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$controller_id")" = host
          test -S /var/run/docker.sock
          docker exec "$controller_id" test -S /var/run/docker.sock

          docker exec "$controller_id" curl --fail --silent --show-error \
            http://127.0.0.1:7681/ >/dev/null
          docker inspect --format '{{.State.Running}}' "$sandbox_name" | grep -qx true
          test "$(docker inspect --format '{{.Config.User}}' "$sandbox_name")" = "0:0"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$sandbox_name")" = bridge
          docker inspect --format '{{json .HostConfig.PortBindings}}' "$sandbox_name" \
            | grep -Eq '"HostIp":"127\.0\.0\.1","HostPort":"7681"'
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/opt/opencode-runtime"}}{{.RW}}{{end}}{{end}}' "$sandbox_name")" = false
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/opt/opencode-runtime"}}{{.Name}}{{end}}{{end}}' "$sandbox_name")" = "$runtime_volume"
          test "$(docker inspect --format '{{.Image}}' "$sandbox_name")" = \
            "$(docker image inspect --format '{{.Id}}' "ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:demo")"
          test -z "$(docker inspect --format '{{range .Mounts}}{{if eq .Name "opencode-repl-tools-demo-update-cache"}}{{.Name}}{{end}}{{end}}' "$sandbox_name")"
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$sandbox_name" | grep -Eq '"ALL"'
          cap_add="$(docker inspect --format '{{json .HostConfig.CapAdd}}' "$sandbox_name")"
          for capability in CHOWN DAC_OVERRIDE SETGID SETPCAP SETUID SYS_ADMIN; do
            grep -Fq "\"$capability\"" <<<"$cap_add"
          done
          security_opts="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$sandbox_name")"
          grep -Fq 'no-new-privileges' <<<"$security_opts"
          grep -Fq 'seccomp=unconfined' <<<"$security_opts"
          grep -Fq 'apparmor=unconfined' <<<"$security_opts"
          docker volume inspect "$update_cache_volume" >/dev/null
          test -z "$(docker ps --filter "name=^/${updater_name}$" --format '{{.ID}}')"
          test "$(docker exec "$sandbox_name" bwrap --version)" = "bubblewrap 0.12.0"

          child_version="$(docker exec "$sandbox_name" /opt/opencode-runtime/bin/opencode2 --version)"
          case "$child_version" in
            "opencode v2."*) ;;
            *)
              echo "child OpenCode is not a stable V2 build: $child_version" >&2
              exit 1
              ;;
          esac
          docker exec "$controller_id" \
            grep -F "OpenCode before update: " /root/.cache/opencode-repl-tools-preview.log
          docker exec "$controller_id" \
            grep -F "OpenCode after update: $child_version" /root/.cache/opencode-repl-tools-preview.log
          printf 'child OpenCode: %s\n' "$child_version"

      - name: Publish validated controller image
        shell: bash
        run: docker push "ghcr.io/${{ github.repository_owner }}/opencode-repl-tools-demo:controller"

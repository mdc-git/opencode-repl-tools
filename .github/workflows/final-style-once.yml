name: Final style once

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Resolve iterator lint/type conflict
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('plugins/repl/src/runtime/operations.ts')
          text = path.read_text()
          text = text.replace(
              "  const values = map.values().toArray()\n  map.clear()\n",
              "  const values: Cell[] = []\n  for (const cell of map.values()) {\n    values.push(cell)\n  }\n\n  map.clear()\n",
          )
          path.write_text(text)
          PY
      - run: bunx --bun eslint . --fix
      - run: bun run format
      - name: Commit style fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: apply final lint and format fixes"
          git push

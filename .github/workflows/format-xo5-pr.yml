name: Format XO 5 branch

on:
  push:
    branches:
      - dependabot/bun/eslint-config-xo-5.0.0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/bun/eslint-config-xo-5.0.0
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format branch
        run: bun run prettier . --write --config tooling/prettier.json
      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-xo5-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(format): normalize XO 5 branch" -m "Apply the repository's configured Prettier formatting after the XO 5 lint migration and remove the temporary branch-only formatter workflow."
          git push

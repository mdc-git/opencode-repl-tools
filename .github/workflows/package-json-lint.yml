name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Prepare
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bun install --frozen-lockfile
            exit 0
          fi

          node scripts/update-direct-deps.mjs --apply
          bun install
          bun audit fix || true
          bunx --bun knip --fix || true
          bunx --bun eslint . --fix || true
          bun run format
          bun install

      - name: Validate
        run: |
          node -e "
          const pkg = require('./package.json')
          if (pkg.dependencies?.['@opencode/plugin'] !== 'beta') {
            throw new Error('@opencode/plugin must remain exactly beta')
          }
          "

          bun run format:check
          bun run lint
          bun run typecheck
          bun run check:workers
          bun run check:deps
          bun run check:knip
          bun run audit
          bun pm pack --dry-run

      - name: Commit validated updates
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(deps): refresh validated dependency graph

          Resolve compatible direct dependency updates while keeping
          @opencode/plugin on the rolling beta channel.

          Apply available security and repository fixes and commit only
          after the complete repository validation suite succeeds."
          git push

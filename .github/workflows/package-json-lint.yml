name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check workers
        run: bun run check:workers

      - name: Check dependency architecture
        run: bun run check:deps

      - name: Check unused code and dependencies
        run: bun run check:knip

      - name: Audit dependencies
        run: bun run audit

      - name: Pack package
        run: bun pm pack

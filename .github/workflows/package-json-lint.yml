name: Repository checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: |
          node -e "
          const pkg = require('./package.json')
          if (pkg.dependencies?.['@opencode/plugin'] !== 'beta') {
            throw new Error('@opencode/plugin must remain exactly beta')
          }
          "

          bun run format:check
          bun run lint
          bun run typecheck
          bun run check:workers
          bun run check:deps
          bun run check:knip
          bun run audit
          bun pm pack --dry-run

      - name: Scan dependency updates
        run: |
          output="$(node scripts/update-direct-deps.mjs)"
          printf '%s\n' "$output"

          {
            echo "## Dependency updates"
            echo
            echo '```text'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if printf '%s\n' "$output" |
            grep -Eq '^(dependencies|devDependencies): '
          then
            echo "::warning title=Dependency updates available::See the workflow summary."
          fi

      - name: Check Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts="$(
            gh api \
              --paginate \
              --slurp \
              "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100"
          )"

          count="$(printf '%s\n' "$alerts" | jq 'add | length')"

          if [ "$count" -eq 0 ]; then
            exit 0
          fi

          printf '%s\n' "$alerts" |
            jq -r 'add[] |
              "::error title=Dependabot vulnerability::\(.dependency.package.name): \(.security_advisory.severity) - \(.security_advisory.summary)"'

          exit 1

name: Repair PR branch

on:
  push:
    branches:
      - dependabot/bun/eslint-config-xo-5.0.0

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/bun/eslint-config-xo-5.0.0
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply mechanical formatting and lint fixes
        run: |
          bun run prettier . --write --config tooling/prettier.json
          bun run eslint . --config tooling/eslint.config.js --fix || true
      - name: Commit mechanical fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lint): apply XO 5 mechanical fixes" -m "Apply Prettier and ESLint auto-fixes generated by the repository's configured rules so the eslint-config-xo 5 upgrade can be validated without disabling or weakening lint checks."
          git push
